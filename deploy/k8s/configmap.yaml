apiVersion: v1
kind: ConfigMap
metadata:
  name: dexter-config
  namespace: dexter-prod
  labels:
    app.kubernetes.io/name: dexter-write
    app.kubernetes.io/component: configuration
data:
  NODE_ENV: "production"
  BACKEND_PORT: "8080"
  FRONTEND_PORT: "80"
  ENABLE_TELEMETRY: "true"
  METRICS_PATH: "/metrics"
  DEFAULT_COMPILER_ENGINE: "tectonic"

