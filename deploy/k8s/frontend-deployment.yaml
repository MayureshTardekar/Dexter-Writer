apiVersion: apps/v1
kind: Deployment
metadata:
  name: dexter-frontend
  namespace: dexter-prod
  labels:
    app.kubernetes.io/name: dexter-write
    app.kubernetes.io/component: frontend
    app: dexter-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dexter-frontend
  template:
    metadata:
      labels:
        app: dexter-frontend
        app.kubernetes.io/name: dexter-write
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: dexter-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2

