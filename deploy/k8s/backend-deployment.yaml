apiVersion: apps/v1
kind: Deployment
metadata:
  name: dexter-backend
  namespace: dexter-prod
  labels:
    app.kubernetes.io/name: dexter-write
    app.kubernetes.io/component: backend
    app: dexter-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dexter-backend
  template:
    metadata:
      labels:
        app: dexter-backend
        app.kubernetes.io/name: dexter-write
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: dexter-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: dexter-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2

