apiVersion: v1
kind: Service
metadata:
  name: dexter-frontend-svc
  namespace: dexter-prod
  labels:
    app.kubernetes.io/name: dexter-write
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: dexter-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: dexter-backend-svc
  namespace: dexter-prod
  labels:
    app.kubernetes.io/name: dexter-write
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: dexter-backend

