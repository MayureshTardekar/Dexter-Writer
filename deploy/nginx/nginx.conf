types {
    application/wasm wasm;
    application/manifest+json webmanifest;
    text/html html;
    text/css css;
    application/javascript js;
    image/svg+xml svg;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;

    # Backend API & Compilation Reverse Proxy
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Direct proxy to backend health check
    location /backend-health {
        proxy_pass http://backend:8080/health;
        proxy_http_version 1.1;
    }

    # Nginx basic stub status for monitoring
    location /stub_status {
        stub_status;
        allow all;
    }

    # Cache immutable static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache WebAssembly binaries and font assets
    location ~* \.(wasm|svg|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA Routing: Fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

