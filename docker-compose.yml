# ==============================================================================
# Dexter Write — Cloud Native Microservices Stack (EC2 & Local Dev)
# ==============================================================================
services:
  # 1. Frontend (Vite SPA + Nginx Reverse Proxy)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dexter-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - dexter-net

  # 2. Backend (Node.js LaTeX Compiler & Telemetry Service)
  backend:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    container_name: dexter-backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - PORT=8080
      - NODE_ENV=production
    networks:
      - dexter-net

  # 3. Host System Metrics Exporter
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: dexter-node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - dexter-net

  # 4. Metrics Collection & Aggregation (Prometheus)
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: dexter-prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - node-exporter
      - backend
    networks:
      - dexter-net

  # 5. Dashboards & Visualization (Grafana)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: dexter-grafana
    ports:
      - "3001:3000"
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/dexter-cloud-overview.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - dexter-net

networks:
  dexter-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
