project_id = "dexter-write"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/**", "http://127.0.0.1:5173", "http://127.0.0.1:5173/**"]
jwt_expiry = 3600
enable_signup = true

# OAuth 2.1 authorization server for Claude/ChatGPT custom connectors.
# Production redirect URLs are configured in the Supabase dashboard.
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.health]
verify_jwt = false

[functions.mcp]
verify_jwt = false
